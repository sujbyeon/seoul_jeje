<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 재개발 초기구역 대시보드</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { --brand-gold: #A78569; --brand-navy: #022136; --apple-bg: #f5f5f7; --card-bg: #ffffff; --ad-bg: #ececed; --accent-red: #d93025; }
        body { font-family: "Pretendard Variable", sans-serif; background-color: var(--apple-bg); color: var(--brand-navy); margin: 0; padding: 60px 20px 0 20px; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }
        header { text-align: center; margin-bottom: 60px; }
        h1 { font-size: 42px; font-weight: 800; margin-bottom: 12px; color: var(--brand-navy); }
        .main-subtitle { font-size: 20px; color: var(--brand-gold); font-weight: 600; }
        .main-subtitle a { color: var(--brand-gold); text-decoration: none; }
        .section-container { width: 100%; max-width: 1300px; margin-bottom: 60px; }
        .section-header { font-size: 24px; font-weight: 700; margin-bottom: 30px; color: var(--brand-navy); display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1.5px; background: linear-gradient(to right, var(--brand-gold), transparent); margin-left: 20px; opacity: 0.3; }
        .notice-board { width: 100%; background: var(--card-bg); border-radius: 24px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 20px; border: 1px solid rgba(167, 133, 105, 0.2); overflow: hidden; }
        .notice-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; text-decoration: none; color: inherit; transition: 0.2s; }
        .notice-item:last-child { border-bottom: none; }
        .notice-item:hover { background-color: #fcfaf8; }
        .badge { background: var(--accent-red); color: white; font-size: 11px; padding: 3px 8px; border-radius: 50px; margin-right: 12px; font-weight: 700; }
        .notice-tag { color: var(--brand-gold); font-weight: 700; font-size: 14px; margin-right: 15px; min-width: 60px; }
        .notice-title { flex: 1; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .notice-date { color: #999; font-size: 13px; margin-left: 15px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; width: 100%; }
        .card { background: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 28px; padding: 40px 20px; text-align: center; border: 1px solid rgba(167, 133, 105, 0.12); display: flex; flex-direction: column; justify-content: space-between; min-height: 180px; transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(167, 133, 105, 0.12); border-color: rgba(167, 133, 105, 0.25); }
        .icon { font-size: 36px; margin-bottom: 18px; }
        .btn { cursor: pointer; width: 100%; height: 46px; background-color: var(--brand-navy); color: white; border: none; border-radius: 14px; font-weight: 600; transition: 0.2s; }
        .btn:hover { background-color: var(--brand-gold); }
        footer { width: 100%; max-width: 1300px; background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(236,236,237,0.5) 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 30px; padding: 44px 32px; margin-top: 40px; margin-bottom: 40px; text-align: center; box-sizing: border-box; border: 1px solid rgba(167, 133, 105, 0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .ad-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
        .ad-item { text-decoration: none; color: inherit; padding: 16px 28px; border-radius: 16px; transition: 0.2s; border: 1px solid transparent; }
        .ad-item:hover { background: rgba(167, 133, 105, 0.06); border-color: rgba(167, 133, 105, 0.15); }
        .ad-label { font-size: 13px; color: #888; margin-bottom: 5px; letter-spacing: 0.02em; }
        .ad-content { font-size: 17px; font-weight: 700; color: var(--brand-navy); }
        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) {
            body { padding: 30px 14px 0 14px; }
            header { margin-bottom: 30px; }
            h1 { font-size: 26px; margin-bottom: 6px; }
            .main-subtitle { font-size: 15px; }
            .section-container { margin-bottom: 36px; }
            .section-header { font-size: 17px; margin-bottom: 16px; }
            .notice-board { border-radius: 16px; padding: 4px 0; }
            .notice-item { padding: 13px 12px; flex-wrap: wrap; gap: 6px 0; }
            .notice-tag { display: none; }
            .badge { font-size: 10px; padding: 2px 7px; margin-right: 8px; flex-shrink: 0; }
            .notice-title { font-size: 14px; white-space: normal; line-height: 1.45; min-width: 0; }
            .notice-date { font-size: 12px; margin-left: auto; flex-shrink: 0; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card { border-radius: 20px; padding: 24px 14px; min-height: 140px; }
            .card h2 { font-size: 16px; margin: 8px 0; }
            .icon { font-size: 28px; margin-bottom: 10px; }
            .btn { height: 40px; font-size: 13px; border-radius: 11px; }
            footer { border-radius: 20px; padding: 24px 12px; margin-top: 24px; margin-bottom: 24px; }
            .ad-container { gap: 8px; }
            .ad-item { padding: 12px 16px; border-radius: 12px; }
            .ad-label { font-size: 12px; }
            .ad-content { font-size: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>서울 재개발 초기구역</h1>
        <div class="main-subtitle">번호부여 현황 확인 <a href="https://blog.naver.com/chachalacha" target="_blank">(by 수잔)</a></div>
    </header>

    <div class="section-container">
        <div class="section-header">🔥 최근 번호부여 업데이트 (실시간)</div>
        <div class="notice-board" id="sheet-notices">
            <p style="text-align:center; padding:20px; color:#999;">데이터를 가져오는 중입니다...</p>
        </div>
    </div>

    <div class="section-container">
        <div class="section-header">강북 지역 (14개 구)</div>
        <div id="northGrid" class="grid"></div>
    </div>

    <div class="section-container">
        <div class="section-header">강남 지역 (11개 구)</div>
        <div id="southGrid" class="grid"></div>
    </div>

    <footer>
        <div class="ad-container">
            <a href="https://blog.naver.com/chachalacha" target="_blank" class="ad-item">
                <div class="ad-label">기획 및 제작</div>
                <div class="ad-content">수잔의 블로그</div>
            </a>
            <a href="https://blog.naver.com/po-tax/222638285211" target="_blank" class="ad-item">
                <div class="ad-label">재개발 전문 세무상담</div>
                <div class="ad-content">⚖️ 세무회계 평온</div>
            </a>
            <a href="https://contents.premium.naver.com/jejeguide/jejemvp" target="_blank" class="ad-item">
                <div class="ad-label">프리미엄 매물 분석</div>
                <div class="ad-content">📈 재개발 재건축 추천매물 스터디</div>
            </a>
        </div>
    </footer>

    <script>
        // Google Sheets gviz 엔드포인트
        const SHEET_ID = '1SUHqOamFuM-g20UbaGIzMp2mpFsWNBJ4gLse1ZfSMyI';

        function renderNotices(data) {
            const container = document.getElementById('sheet-notices');
            const rows = data.table.rows;

            if (!rows || rows.length === 0) {
                container.innerHTML = '<p style="padding:20px; text-align:center; color:#999;">등록된 데이터가 없습니다.</p>';
                return;
            }

            container.innerHTML = '';
            rows.forEach(row => {
                const c = row.c;
                if (!c || c.length < 4) return;

                const badge = c[0] ? c[0].v : 'NEW';
                const tag   = c[1] ? c[1].v : '서울';
                const title = c[2] ? c[2].v : '제목 없음';
                const link  = c[3] ? c[3].v : '#';
                const date  = c[4] ? (c[4].f || c[4].v) : '';

                if (!title || link === '#') return;

                container.innerHTML += `
                    <a href="${link}" target="_blank" class="notice-item">
                        <span class="badge">${badge}</span>
                        <span class="notice-tag">${tag}</span>
                        <span class="notice-title">${title}</span>
                        <span class="notice-date">${date}</span>
                    </a>`;
            });
        }

        function loadSheetData() {
            const container = document.getElementById('sheet-notices');
            const gvizUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

            // 방법 1: fetch 시도
            fetch(gvizUrl)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(text => {
                    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+?)\);?\s*$/);
                    if (!match) throw new Error('응답 형식 오류');
                    renderNotices(JSON.parse(match[1]));
                })
                .catch(err => {
                    console.warn('[fetch 실패, JSONP로 재시도]', err.message);
                    loadViaJSONP();
                });
        }

        // 방법 2: JSONP (script 태그) - CORS 완전 우회
        function loadViaJSONP() {
            const container = document.getElementById('sheet-notices');
            const callbackName = 'sheetCallback_' + Date.now();

            window[callbackName] = function(data) {
                try {
                    renderNotices(data);
                } catch (e) {
                    console.error('[JSONP 파싱 에러]', e);
                    container.innerHTML = '<p style="padding:20px; text-align:center;">데이터를 불러오는 중입니다. 잠시만 기다려주세요.</p>';
                    setTimeout(loadSheetData, 2000);
                }
                delete window[callbackName];
                document.getElementById('jsonp-script')?.remove();
            };

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&gid=0`;
            script.onerror = function() {
                console.error('[JSONP 로딩 실패]');
                container.innerHTML = '<p style="padding:20px; text-align:center;">데이터를 불러오는 중입니다. 잠시만 기다려주세요.</p>';
                delete window[callbackName];
                setTimeout(loadSheetData, 2000);
            };
            document.body.appendChild(script);
        }

        const north = [
            { name: "강북구", icon: "🏛️", url: "https://www.gangbuk.go.kr/portal/bbs/B0000035/list.do?menuNo=200607" },
            { name: "광진구", icon: "🏘️", url: "https://www.gwangjin.go.kr/portal/bbs/B0000001/list.do?pageIndex=1&menuNo=200190&searchCnd=1&searchWrd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "노원구", icon: "🌳", url: "https://www.nowon.kr/www/user/bbs/BD_selectBbsList.do?q_bbsCode=1004&q_searchKeyTy=sj___1002&q_searchVal=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "도봉구", icon: "🏔️", url: "https://www.dobong.go.kr/WDB_common/search_new/search.asp?category=BBS&kwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC+%EC%9A%94%EC%B2%AD" },
            { name: "동대문구", icon: "🍎", url: "https://www.ddm.go.kr/www/selectBbsNttList.do?key=198&bbsNo=38&searchCnd=SJ&searchKrwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "마포구", icon: "🌉", url: "https://www.mapo.go.kr/site/main/board/notice/list?sv=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "서대문구", icon: "🏫", url: "https://www.sdm.go.kr/city/redev/business.do" },
            { name: "성동구", icon: "💎", url: "https://www.sd.go.kr/main/selectBbsNttList.do?key=1307&bbsNo=166&searchCnd=SJ&searchKrwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "성북구", icon: "📚", url: "https://www.sb.go.kr/www/selectBbsNttList.do?key=6350&bbsNo=41&searchCnd=SJ&searchKrwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "용산구", icon: "🚉", url: "https://www.yongsan.go.kr/portal/bbs/B0000170/list.do?menuNo=200848&searchCnd=1&searchWrd=%EB%8F%99%EC%9D%98%EC%84%9C" },
            { name: "은평구", icon: "🌋", url: "https://www.ep.go.kr/www/selectBbsNttList.do?key=1063&bbsNo=63&searchCnd=SJ&searchKrwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "종로구", icon: "🏯", url: "https://www.jongno.go.kr/cmm/search/searchEngine.do", isManual: true },
            { name: "중구", icon: "🏙️", url: "https://www.junggu.seoul.kr/content.do?cmsid=14231", isManual: true },
            { name: "중랑구", icon: "🌹", url: "https://www.jungnang.go.kr/dong/bbs/list/B0000002.do?menuNo=500012&dong=01" }
        ].sort((a, b) => a.name.localeCompare(b.name, 'ko'));

        const south = [
            { name: "강남구", icon: "🏙️", url: "https://www.gangnam.go.kr/board/union6/list.do?keyfield=bdm_main_title&keyword=%EB%8F%99%EC%9D%98%EC%84%9C" },
            { name: "강동구", icon: "☀️", url: "https://www.gangdong.go.kr/web/newportal/bbs/b_111/list?sv=%EB%8F%99%EC%9D%98%EC%84%9C" },
            { name: "강서구", icon: "✈️", url: "https://www.gangseo.seoul.kr/gs040101", isManual: true },
            { name: "관악구", icon: "⛰️", url: "https://www.gwanak.go.kr/site/gwanak/ex/bbsNew/List.do?typeCode=1", isManual: true },
            { name: "구로구", icon: "⚙️", url: "https://www.guro.go.kr/www/selectBbsNttList.do?key=1790&bbsNo=662&searchCnd=SJ&searchKrwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "금천구", icon: "👔", url: "https://www.geumcheon.go.kr/portal/selectBbsNttList.do?key=4299&bbsNo=150604&searchCnd=SJ&searchKrwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" },
            { name: "동작구", icon: "🎓", url: "https://www.dongjak.go.kr/search.do", isManual: true },
            { name: "서초구", icon: "⚖️", url: "https://www.seocho.go.kr/site/seocho/ex/bbs/List.do?cbIdx=57" },
            { name: "송파구", icon: "🏰", url: "https://www.songpa.go.kr/search/search_page.jsp", isManual: true },
            { name: "양천구", icon: "🌳", url: "https://www.yangcheon.go.kr/site/search/main.jsp", isManual: true },
            { name: "영등포구", icon: "🏢", url: "https://www.ydp.go.kr/www/selectBbsNttList.do?key=2848&bbsNo=40&searchCnd=SJ&searchKrwd=%EB%8F%99%EC%9D%98%EC%84%9C+%EB%B2%88%ED%98%B8%EB%B6%80%EC%97%AC" }
        ].sort((a, b) => a.name.localeCompare(b.name, 'ko'));

        function draw(target, list) {
            const el = document.getElementById(target);
            list.forEach(d => {
                const c = document.createElement('div');
                c.className = 'card';
                const btnLabel = d.isManual ? '검색어 입력' : '현황 확인';
                c.innerHTML = `<span class="icon">${d.icon}</span><h2>${d.name}</h2><button class="btn" onclick="window.open('${d.url}')">${btnLabel}</button>`;
                el.appendChild(c);
            });
        }

        draw('northGrid', north);
        draw('southGrid', south);
        loadSheetData();
    </script>
</body>
</html>
