<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 재개발 초기구역(연변동의서 현황)</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { --brand-gold: #A78569; --brand-navy: #022136; --apple-bg: #f5f5f7; --card-bg: #ffffff; --ad-bg: #ececed; --accent-red: #d93025; }
        body { font-family: "Pretendard Variable", sans-serif; background-color: var(--apple-bg); color: var(--brand-navy); margin: 0; padding: 60px 20px 0 20px; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }
        header { text-align: center; margin-bottom: 60px; }
        h1 { font-size: 42px; font-weight: 800; margin-bottom: 12px; color: var(--brand-navy); }
        .main-subtitle { font-size: 20px; color: var(--brand-gold); font-weight: 600; }
        .main-subtitle a { color: var(--brand-gold); text-decoration: none; }
        .section-container { width: 100%; max-width: 1300px; margin-bottom: 60px; }
        .section-header { font-size: 24px; font-weight: 700; margin-bottom: 30px; color: var(--brand-navy); display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1.5px; background: linear-gradient(to right, var(--brand-gold), transparent); margin-left: 20px; opacity: 0.3; }

        .notice-board { width: 100%; background: var(--card-bg); border-radius: 24px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid rgba(167, 133, 105, 0.2); overflow: hidden; box-sizing: border-box; }
        .notice-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; text-decoration: none; color: inherit; transition: 0.2s; cursor: pointer; }
        .notice-item:last-child { border-bottom: none; }
        .notice-item:hover { background-color: #fcfaf8; }

        .search-area { width: 100%; max-width: 1300px; margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
        .search-wrapper { width: 100%; margin-bottom: 10px; }
        .search-input { width: 100%; padding: 16px 24px; border-radius: 18px; border: 1px solid rgba(167, 133, 105, 0.3); background: var(--card-bg); font-family: inherit; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.02); text-align: center; }
        .search-input:focus { border-color: var(--brand-gold); box-shadow: 0 4px 20px rgba(167, 133, 105, 0.1); }

        .search-info { font-size: 14px; color: var(--brand-gold); margin-top: 5px; font-weight: 600; display: none; text-align: center; width: 100%; }

        .badge { background: var(--accent-red); color: white; font-size: 11px; padding: 4px 10px; border-radius: 50px; margin-right: 12px; font-weight: 700; white-space: nowrap; }
        .badge-date { background: var(--brand-navy) !important; min-width: 70px; display: inline-flex; justify-content: center; padding: 4px 0 !important; }

        .notice-tag { color: var(--brand-gold); font-weight: 700; font-size: 14px; margin-right: 15px; min-width: 60px; }
        .notice-title { flex: 1; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .notice-date { color: #999; font-size: 13px; margin-left: 15px; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; width: 100%; }
        .card { background: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 28px; padding: 40px 20px; text-align: center; border: 1px solid rgba(167, 133, 105, 0.12); display: flex; flex-direction: column; justify-content: space-between; min-height: 180px; transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(167, 133, 105, 0.12); border-color: rgba(167, 133, 105, 0.25); }
        .icon { font-size: 36px; margin-bottom: 18px; }
        .btn { cursor: pointer; width: 100%; height: 46px; background-color: var(--brand-navy); color: white; border: none; border-radius: 14px; font-weight: 600; transition: 0.2s; }
        .btn:hover { background-color: var(--brand-gold); }

        footer { width: 100%; max-width: 1300px; background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(236,236,237,0.5) 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 30px; padding: 44px 32px; margin-top: 40px; margin-bottom: 40px; text-align: center; box-sizing: border-box; border: 1px solid rgba(167, 133, 105, 0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .ad-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
        .ad-item { text-decoration: none; color: inherit; padding: 16px 28px; border-radius: 16px; transition: 0.2s; border: 1px solid transparent; }
        .ad-item:hover { background: rgba(167, 133, 105, 0.06); border-color: rgba(167, 133, 105, 0.15); }
        .ad-label { font-size: 13px; color: #888; margin-bottom: 5px; letter-spacing: 0.02em; }
        .ad-content { font-size: 17px; font-weight: 700; color: var(--brand-navy); }

        @media (max-width: 600px) {
            body { padding: 30px 14px 0 14px; }
            h1 { font-size: 26px; }
            .notice-tag { display: none; }
            .notice-title { font-size: 14px; white-space: normal; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            .ad-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <h1>서울 재개발 초기구역</h1>
        <div class="main-subtitle">번호부여 현황 확인 <a href="https://blog.naver.com/chachalacha" target="_blank">(by 수잔)</a></div>
    </header>

    <div class="section-container">
        <div class="section-header">🔥 최근 번호부여 업데이트</div>
        <div class="notice-board" id="sheet-notices">
            <p style="text-align:center; padding:20px; color:#999;">데이터를 가져오는 중입니다...</p>
        </div>
        <div class="search-area">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="찾으시는 구 명칭이나 구역명을 입력하세요 (전체 데이터 검색)">
            </div>
            <div id="searchInfo" class="search-info">💡 해당 구의 이전 번호부여 이력을 검색합니다.</div>
        </div>
    </div>

    <div class="section-container">
        <div class="section-header">강북 지역 (14개 구)</div>
        <div id="northGrid" class="grid"></div>
    </div>

    <div class="section-container">
        <div class="section-header">강남 지역 (11개 구)</div>
        <div id="southGrid" class="grid"></div>
    </div>

    <footer>
        <div class="ad-container">
            <a href="https://blog.naver.com/chachalacha" target="_blank" class="ad-item">
                <div class="ad-label">기획 및 제작</div>
                <div class="ad-content">수잔의 블로그</div>
            </a>
            <a href="https://blog.naver.com/po-tax/222638285211" target="_blank" class="ad-item">
                <div class="ad-label">재개발 전문 세무상담</div>
                <div class="ad-content">⚖️ 세무회계 평온</div>
            </a>
            <a href="https://contents.premium.naver.com/jejeguide/jejemvp" target="_blank" class="ad-item">
                <div class="ad-label">프리미엄 매물 분석</div>
                <div class="ad-content">📈 재개발 재건축 추천매물 스터디</div>
            </a>
        </div>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyOBmKdfLu9Td2xblqvFkxUWdxDdGEvWe1-yDJkDnHYyFyYp3-Eyy6huJ98Lqg8cnAH2Q/exec';

        let mainData = [];
        let searchData = [];

        // 날짜 포맷 변환
        function formatDate(raw) {
            if (!raw) return '';
            const d = new Date(raw);
            if (isNaN(d)) return raw; // 이미 텍스트 형식이면 그대로
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // 공지 HTML 생성
        function createNoticeHTML(rows, isSearch = false) {
            if (!rows || rows.length === 0) return '<p style="padding:20px; text-align:center; color:#999;">결과가 없습니다.</p>';
            let html = '';
            rows.forEach(row => {
                if (!row.title || row.title === '제목') return;
                const tag   = row.tag   || '';
                const title = row.title || '';
                const link  = row.link  || '#';
                const date  = formatDate(row.date);
                const badge = row.badge || 'NEW';

                let badgeHTML = isSearch
                    ? `<span class="badge badge-date">${date}</span>`
                    : `<span class="badge">${badge}</span>`;

                html += `<div class="notice-item" onclick="window.open('${link}', '_blank')">
                            ${badgeHTML}
                            ${tag ? `<span class="notice-tag">${tag}</span>` : ''}
                            <span class="notice-title">${title}</span>
                            <span class="notice-date">${isSearch ? '' : date}</span>
                         </div>`;
            });
            return html || '<p style="padding:20px; text-align:center; color:#999;">결과가 없습니다.</p>';
        }

        // API에서 데이터 로드
        async function loadFromAPI() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();

                // 공고 데이터 (최신 5개만 메인에 표시)
                const rows = (json.notices || []).filter(r => r.title && r.title !== '제목');
                searchData = rows;
                mainData = rows.slice(0, 5);
                document.getElementById('sheet-notices').innerHTML = createNoticeHTML(mainData, false);

                // 구청 카드 데이터
                const districts = json.districts || [];
                const north = districts.filter(d => d.region === 'north').sort((a,b) => a.name.localeCompare(b.name, 'ko'));
                const south = districts.filter(d => d.region === 'south').sort((a,b) => a.name.localeCompare(b.name, 'ko'));
                drawGrid('northGrid', north);
                drawGrid('southGrid', south);

            } catch(e) {
                document.getElementById('sheet-notices').innerHTML = '<p style="padding:20px; text-align:center; color:#999;">데이터를 불러오지 못했습니다.</p>';
            }
        }

        // 구청 카드 그리기
        function drawGrid(targetId, list) {
            const el = document.getElementById(targetId);
            el.innerHTML = '';
            list.forEach(d => {
                const c = document.createElement('div');
                c.className = 'card';
                const btnLabel = d.isManual ? '검색어 입력' : '현황 확인';
                c.innerHTML = `<span class="icon">${d.icon}</span><h2>${d.name}</h2><button class="btn">${btnLabel}</button>`;
                c.querySelector('.btn').addEventListener('click', () => window.open(d.url, '_blank'));
                el.appendChild(c);
            });
        }

        // 검색
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            const container = document.getElementById('sheet-notices');
            const info = document.getElementById('searchInfo');

            if (keyword === '') {
                container.innerHTML = createNoticeHTML(mainData, false);
                info.style.display = 'none';
                return;
            }

            info.style.display = 'block';
            const filtered = searchData.filter(row => {
                const tag   = String(row.tag   || '').toLowerCase();
                const title = String(row.title || '').toLowerCase();
                return tag.includes(keyword) || title.includes(keyword);
            });
            container.innerHTML = createNoticeHTML(filtered, true);
        });

        loadFromAPI();
    </script>
</body>
</html>
